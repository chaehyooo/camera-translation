<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카메라 쉬운 말 번역기</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; color: #18212f; background: #f4f6fa; }
    body { margin: 0; padding: 24px 14px 48px; }
    main { max-width: 820px; margin: 0 auto; }
    h1 { margin-bottom: 8px; font-size: clamp(25px, 5vw, 36px); }
    .lead { color: #536176; margin-top: 0; line-height: 1.6; }
    section { background: white; border: 1px solid #dce2ea; border-radius: 16px; padding: 20px; margin-top: 18px; box-shadow: 0 2px 10px #1720330b; }
    h2 { font-size: 20px; margin-top: 0; }
    button { border: 0; background: #2058a6; color: white; border-radius: 10px; padding: 11px 15px; font-size: 15px; font-weight: 650; cursor: pointer; }
    button.secondary { background: #e7edf6; color: #24364d; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
    video, canvas { display: block; max-width: 100%; width: 100%; border-radius: 12px; margin-top: 12px; background: #e9edf3; }
    #camera-area { display: none; }
    input[type=file] { margin-top: 8px; max-width: 100%; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f7f9fc; padding: 14px; border-radius: 10px; line-height: 1.65; font-family: inherit; }
    #status { padding: 11px 13px; border-radius: 10px; background: #eef3fa; color: #334b6b; margin-top: 14px; }
    #status.error { background: #fff0f0; color: #9a2424; }
    .muted { color: #64748b; font-size: 13px; }
    .term { border: 1px solid #e0e6ee; border-radius: 10px; padding: 11px; margin: 8px 0; }
    .term strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
<main>
  <h1>카메라 쉬운 말 번역기</h1>
  <p class="lead">문서 사진에서 글자를 읽고, 어려운 단어를 찾아 쉬운 한국어로 바꿔 줍니다.</p>
  <section>
    <h2>1. 사진 촬영 또는 업로드</h2>
    <p class="muted">카메라는 localhost에서 실행할 때 브라우저 권한이 필요합니다. 카메라가 안 되면 이미지 파일을 업로드하세요.</p>
    <div class="actions">
      <button id="start-camera">카메라 켜기</button>
      <button id="capture" class="secondary" disabled>사진 촬영 후 번역</button>
      <button id="stop-camera" class="secondary" disabled>카메라 끄기</button>
    </div>
    <div id="camera-area"><video id="video" autoplay playsinline></video></div>
    <canvas id="canvas" hidden></canvas>
    <hr style="border:0;border-top:1px solid #e5eaf1;margin:20px 0">
    <label for="image-file"><strong>또는 이미지 파일 선택</strong></label><br>
    <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp">
    <div class="actions"><button id="upload-translate" class="secondary">선택한 사진 번역</button></div>
    <div id="status" role="status">준비 완료. 사진을 촬영하거나 업로드해 주세요.</div>
  </section>
  <section id="result" hidden>
    <h2>2. 번역 결과</h2>
    <h3>인식한 원문</h3><pre id="ocr-text"></pre>
    <h3>찾은 어려운 단어</h3><div id="matches"></div>
    <h3>쉬운 말 결과</h3><pre id="easy-text"></pre>
  </section>
  <p class="muted">AI 번역 결과는 오류가 있을 수 있습니다. 지원 자격, 금액, 신청 기한은 원문과 대조해 주세요.</p>
</main>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const cameraArea = document.getElementById("camera-area");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const fileInput = document.getElementById("image-file");
let mediaStream = null;
function setStatus(message, isError = false) { statusBox.textContent = message; statusBox.classList.toggle("error", isError); }
function showMatches(matches) {
  const container = document.getElementById("matches"); container.replaceChildren();
  if (!matches || matches.length === 0) { container.textContent = "단어장에서 일치하는 단어를 찾지 못했습니다."; return; }
  for (const item of matches) {
    const el = document.createElement("div"); el.className = "term";
    const term = document.createElement("strong"); term.textContent = item["용어"] || "";
    const explanation = document.createElement("div"); explanation.textContent = item["쉬운 설명"] || "";
    el.append(term, explanation); container.appendChild(el);
  }
}
async function sendImage(file, filename) {
  if (!file) { setStatus("먼저 사진을 선택하거나 촬영해 주세요.", true); return; }
  const formData = new FormData(); formData.append("image", file, filename || file.name || "camera.jpg");
  setStatus("사진 처리 중입니다. 처음 실행은 OCR 모델 다운로드로 시간이 걸릴 수 있습니다.");
  document.getElementById("upload-translate").disabled = true; document.getElementById("capture").disabled = true;
  try {
    const response = await fetch("/api/translate", { method: "POST", body: formData });
    const data = await response.json(); if (!response.ok) throw new Error(data.error || "번역에 실패했습니다.");
    document.getElementById("ocr-text").textContent = data.ocr_text || "";
    document.getElementById("easy-text").textContent = data.easy_text || ""; showMatches(data.matches);
    resultBox.hidden = false; setStatus("번역이 완료됐어요.");
  } catch (error) { setStatus(error.message || "요청 중 오류가 발생했습니다.", true); }
  finally { document.getElementById("upload-translate").disabled = false; document.getElementById("capture").disabled = !mediaStream; }
}
document.getElementById("start-camera").addEventListener("click", async () => {
  try { mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); video.srcObject = mediaStream; cameraArea.style.display = "block"; document.getElementById("capture").disabled = false; document.getElementById("stop-camera").disabled = false; setStatus("카메라가 켜졌어요. 글자가 선명하게 보이도록 맞춰 주세요."); }
  catch (_) { setStatus("카메라를 열 수 없어요. 브라우저 권한을 허용하거나 이미지 파일을 업로드해 주세요.", true); }
});
document.getElementById("stop-camera").addEventListener("click", () => { if (mediaStream) mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; video.srcObject = null; cameraArea.style.display = "none"; document.getElementById("capture").disabled = true; document.getElementById("stop-camera").disabled = true; setStatus("카메라가 꺼졌어요."); });
document.getElementById("capture").addEventListener("click", () => { if (!video.videoWidth || !video.videoHeight) { setStatus("카메라 화면이 아직 준비되지 않았어요.", true); return; } canvas.width = video.videoWidth; canvas.height = video.videoHeight; canvas.getContext("2d").drawImage(video, 0, 0); canvas.toBlob(blob => { if (blob) sendImage(blob, "camera-photo.jpg"); else setStatus("사진을 만들지 못했어요. 다시 촬영해 주세요.", true); }, "image/jpeg", 0.9); });
document.getElementById("upload-translate").addEventListener("click", () => { const file = fileInput.files && fileInput.files[0]; sendImage(file, file ? file.name : ""); });
</script>
</body>
</html>
